<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="referrer" content="no-referrer" />
<title>Abrir link externo</title>
<style>
  html,body{margin:0;height:100%;background:#0b0b10;color:#e6e6ea;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
  .wrap{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;gap:14px;padding:24px;text-align:center}
  a.btn{padding:12px 18px;border-radius:10px;background:#7c5cff;color:#fff;font-weight:600;text-decoration:none}
  p{max-width:520px;line-height:1.5;color:#bdbdc7}
  code{background:#1a1a24;padding:2px 6px;border-radius:6px;word-break:break-all}
</style>
</head>
<body>
<div class="wrap">
  <h2>Abrir link externo</h2>
  <p id="msg">Clique no botão para abrir o link em uma nova aba.</p>
  <a id="link" class="btn" target="_blank" rel="noopener noreferrer">Abrir link</a>
  <p><code id="raw"></code></p>
</div>
<script>
(function(){
  try {
    var qs = new URLSearchParams(location.search);
    var url = qs.get('url') || '';
    if (!/^https?:\/\//i.test(url)) {
      document.querySelector('.wrap').innerHTML = '<p>Link inválido.</p>';
      return;
    }
    var a = document.getElementById('link');
    a.href = url;
    document.getElementById('raw').textContent = url;
  } catch (e) {}
})();
</script>
</body>
</html>
